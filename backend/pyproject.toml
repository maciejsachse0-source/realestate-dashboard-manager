[project]
name = "najem"
version = "0.1.0"
description = "System zarzadzania umowami najmu, wewnetrzny, on-prem"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "apscheduler>=3.11",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/najem"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # polskie znaki diakrytyczne w tekstach
    "N818",  # wyjatki domenowe maja nazwy polskie, sufiks "Error" bylby kalka
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/najem", "tests"]
ignore_missing_imports = true

# Warstwa domenowa: tam gdzie licza sie pieniadze, typy sie oplacaja (plan, sekcja 2.1)
[[tool.mypy.overrides]]
module = "najem.domena.*"
strict = true
disallow_any_explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integracja: testy wymagajace dzialajacej bazy danych",
]
